name: Build and publish Windows installer

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows wizard installer
        shell: pwsh
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          $output = Join-Path $env:GITHUB_WORKSPACE "dist-installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc (Join-Path $env:GITHUB_WORKSPACE "installer\PromptPilotSetup.iss") "/O$output"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = Join-Path $output "PromptPilotSetup.exe"
          if (!(Test-Path $setup)) {
            throw "PromptPilotSetup.exe was not produced."
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "Installer SHA-256: `$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Item $setup | Format-List Name,Length,LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptPilot-Windows-Installer
          path: dist-installer/PromptPilotSetup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Windows installer
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          target_commitish: ${{ github.sha }}
          name: PromptPilot Windows Installer (latest)
          body: |
            Rolling Windows installer for PromptPilot, built from the repository's main branch.

            Download PromptPilotSetup.exe to open the Windows setup wizard. Choose Full install for browser automation plus PC-control vision, or Browser automation only to skip the extra vision model.

            After setup, launch Start PromptPilot Agent and Start PromptPilot Tunnel from the Start Menu. The local agent and all desktop/browser actions run on your own PC. The temporary tunnel URL and bearer token are secrets.
          files: dist-installer/PromptPilotSetup.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
