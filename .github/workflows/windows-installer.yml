name: Build and Authenticode-sign Windows installer

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
      - "README.md"
      - "docs/CODE-SIGNING.md"
      - "code-signing.html"
      - "index.html"
      - "build.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-sign-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows wizard installer
        shell: pwsh
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $output = Join-Path $env:GITHUB_WORKSPACE "dist-installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc (Join-Path $env:GITHUB_WORKSPACE "installer\PromptPilotSetup.iss") "/O$output"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Join-Path $output "PromptPilotSetup.exe"
          if (!(Test-Path $setup)) { throw "PromptPilotSetup.exe was not produced." }
          Get-Item $setup | Format-List Name,Length,LastWriteTime

      - name: Check SignPath configuration
        id: signing-config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $missing = @()
          foreach ($name in @("SIGNPATH_API_TOKEN","SIGNPATH_ORGANIZATION_ID","SIGNPATH_PROJECT_SLUG","SIGNPATH_SIGNING_POLICY_SLUG")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "## Authenticode signing is not configured" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "The setup wizard compiled, but no public release was published because trusted signing is not configured. Complete the steps in [docs/CODE-SIGNING.md](https://github.com/Rohit-Singh-1991/Mini-PC/blob/main/docs/CODE-SIGNING.md)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Warning ("Missing GitHub Actions secrets/variables: " + ($missing -join ", ") + ". Trusted signing is required before publishing. Follow docs/CODE-SIGNING.md.")
          } else {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "SignPath credentials and project variables are configured." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Mark existing release as unsigned while signing is pending
        if: steps.signing-config.outputs.ready != 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseJson = gh release view installer-latest --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseJson)) {
            Write-Warning "No existing installer-latest release found to label."
            exit 0
          }
          $release = $releaseJson | ConvertFrom-Json
          $hasInstaller = @($release.assets | Where-Object { $_.name -eq "PromptPilotSetup.exe" }).Count -gt 0
          $notes = @'
          # PromptPilot Windows installer — UNSIGNED

          **The current executable is NOT Authenticode-signed.** SignPath Foundation acceptance and trusted signing configuration are still pending. Do not treat this download as a trusted-publisher build; Windows may show an unknown-publisher warning.

          The asset is retained as the existing unsigned build for transparency, not represented as signed. A replacement will be published only after the release workflow verifies a valid Authenticode signature and trusted timestamp.

          Code signing policy: https://github.com/Rohit-Singh-1991/Mini-PC/blob/main/code-signing.html
          Full signing guide: https://github.com/Rohit-Singh-1991/Mini-PC/blob/main/docs/CODE-SIGNING.md

          To verify the current file's hash on Windows:
          ```powershell
          Get-FileHash .\PromptPilotSetup.exe -Algorithm SHA256
          Get-AuthenticodeSignature .\PromptPilotSetup.exe | Format-List Status,SignerCertificate,TimeStamperCertificate
          ```
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP "unsigned-release-notes.md"
          Set-Content -Path $notesPath -Value $notes -Encoding utf8
          gh release edit installer-latest --repo $env:GITHUB_REPOSITORY --title "PromptPilot Windows Installer (UNSIGNED — signing pending)" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "Failed to label the existing release as unsigned." }
          if ($hasInstaller) { Write-Host "Existing unsigned installer asset remains available but the release is clearly labelled UNSIGNED." }

      - name: Require trusted signing before completing this workflow
        if: steps.signing-config.outputs.ready != 'true'
        shell: pwsh
        run: |
          throw "Trusted Authenticode signing is not configured. The existing release was labelled UNSIGNED; submit the SignPath Foundation application, configure the SignPath project, then set the GitHub Actions secret and variables listed in docs/CODE-SIGNING.md."

      - name: Upload unsigned candidate for SignPath
        if: steps.signing-config.outputs.ready == 'true'
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptPilot-Windows-Installer-Unsigned
          path: dist-installer/PromptPilotSetup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Submit Authenticode signing request
        if: steps.signing-config.outputs.ready == 'true'
        uses: signpath/github-action-submit-signing-request@4184a38a17e5b37d026a3ed443581c1f03ae1b3a # v3.0, pinned to an immutable commit
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Verify Authenticode signature and timestamp
        if: steps.signing-config.outputs.ready == 'true'
        shell: pwsh
        run: |
          $signedFile = Get-ChildItem -Path "signed-installer" -Filter "PromptPilotSetup.exe" -File -Recurse | Select-Object -First 1
          if (!$signedFile) { throw "SignPath completed but the signed PromptPilotSetup.exe was not found." }
          $signature = Get-AuthenticodeSignature -FilePath $signedFile.FullName
          if ($signature.Status -ne "Valid") {
            throw "Authenticode signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          if (!$signature.SignerCertificate) { throw "The signed installer has no signer certificate." }
          if (!$signature.TimeStamperCertificate) { throw "The signature has no trusted timestamp; refusing release." }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "dist-installer-signed"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $releaseFile = Join-Path $releaseDir "PromptPilotSetup.exe"
          Copy-Item $signedFile.FullName $releaseFile -Force
          $hash = (Get-FileHash $releaseFile -Algorithm SHA256).Hash
          "## Authenticode verification passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Signer: $($signature.SignerCertificate.Subject)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Timestamp certificate: $($signature.TimeStamperCertificate.Subject)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "SHA-256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-AuthenticodeSignature -FilePath $releaseFile | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate

      - name: Upload verified signed installer artifact
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PromptPilot-Windows-Installer-Signed
          path: dist-installer-signed/PromptPilotSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed installer as latest release
        if: steps.signing-config.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          target_commitish: ${{ github.sha }}
          name: PromptPilot Windows Installer (Authenticode-signed)
          body: |
            # PromptPilot Windows installer (Authenticode-signed)

            Free code signing provided by SignPath.io, certificate by SignPath Foundation.

            This asset is published only after SignPath has completed signing and Windows reports a valid Authenticode signature with a trusted timestamp. Verify the signature with PowerShell:
            Get-AuthenticodeSignature .\PromptPilotSetup.exe | Format-List Status,SignerCertificate,TimeStamperCertificate

            Code signing policy: https://github.com/Rohit-Singh-1991/Mini-PC/blob/main/code-signing.html
            Committers and reviewers: https://github.com/Rohit-Singh-1991
            Signing approver: https://github.com/Rohit-Singh-1991
            Privacy: This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it.

            Choose Full install for browser automation plus PC-control vision, or Browser automation only to skip the extra vision model.
            After setup, launch Start PromptPilot Agent and Start PromptPilot Tunnel from the Start Menu. The local agent and all desktop/browser actions run on your own PC. The temporary tunnel URL and bearer token are secrets.
          files: dist-installer-signed/PromptPilotSetup.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
