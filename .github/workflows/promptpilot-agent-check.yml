name: Mini-PC agent sanity checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check agent syntax
        run: node --check agent/agent.mjs
      - name: Check dashboard and helper-module syntax
        run: node --check app.js && node --check agent-connection-policy.mjs && node --check scripts/verify-production.mjs
      - name: Validate local-agent package metadata
        run: node -e "const p=require('./agent/package.json'); if(p.engines.node !== '>=22') process.exit(1); console.log(p.name, p.version)"
      - name: Build hosted dashboard and download kit
        run: npm run build
      - name: Install open-source local-agent dependencies
        run: npm install --prefix agent
      - name: Install Chromium for smoke test
        working-directory: agent
        run: npx playwright install chromium
      - name: Exercise local API, MCP bridge and browser flow with mock Ollama
        working-directory: agent
        run: npm run test:smoke
      - name: Verify dashboard and safety controls
        run: node scripts/verify-production.mjs
  windows-sanity:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check runtime and dashboard syntax on Windows
        run: npm run check --prefix agent; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node --check app.js; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node --check agent-connection-policy.mjs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node --check scripts/verify-production.mjs
      - name: Install native-agent dependencies on Windows
        run: npm install --prefix agent
      - name: Install Chromium on Windows
        run: npx playwright install chromium
      - name: Exercise browser and safety smoke tests on Windows
        run: npm run test:smoke --prefix agent

