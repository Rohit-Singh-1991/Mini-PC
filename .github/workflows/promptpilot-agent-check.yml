name: Mini-PC agent sanity checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check agent syntax
        run: node --check agent/agent.mjs
      - name: Check dashboard ES-module syntax
        run: node --check app.js && node --check agent-connection-policy.mjs
      - name: Validate local-agent package metadata
        run: node -e "const p=require('./agent/package.json'); if(p.engines.node !== '>=22') process.exit(1); console.log(p.name, p.version)"
      - name: Build hosted dashboard and download kit
        run: npm run build
      - name: Install open-source local-agent dependencies
        run: npm install --prefix agent
      - name: Install Chromium for smoke test
        working-directory: agent
        run: npx playwright install chromium
      - name: Exercise local API, MCP bridge and browser flow with mock Ollama
        working-directory: agent
        run: npm run test:smoke
      - name: Verify dashboard and safety controls
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const h=fs.readFileSync("index.html","utf8");
          const app=fs.readFileSync("app.js","utf8");
          if (!h.includes('<script type="module" src="/app.js"></script>')) throw new Error("dashboard must load external app.js as a module");
          if (/<script>([\s\S]*?)<\/script>/.test(h)) throw new Error("inline scripts are forbidden by the release CSP");
          if (!app.includes("import { allowedAgentOrigin } from './agent-connection-policy.mjs';")) throw new Error("dashboard must use the tested agent-origin allowlist");
          for (const s of ["prompt","agentUrl","agentToken","previewImage","allowPC","URL security module","Approval policy","/agent/agent.mjs","/agent/mcp-bridge.mjs"]) if (!h.includes(s)) throw new Error("missing UI element or route: "+s);
          for (const s of ["sessionStorage","/api/run","/api/approve","/api/pc/click"]) if (!app.includes(s)) throw new Error("missing dashboard behavior: "+s);
          for (const s of ["app.js","index.html","agent-connection-policy.mjs"]) if (!fs.existsSync("dist/"+s)) throw new Error("production build is missing dist/"+s);
          for (const s of ["security.mjs","approval-policy.mjs","mcp-bridge.mjs","install.ps1"]) if (!fs.existsSync("dist/agent/"+s)) throw new Error("setup kit is missing "+s);
          const a=fs.readFileSync("agent/agent.mjs","utf8");
          const sec=fs.readFileSync("agent/security.mjs","utf8");
          const ap=fs.readFileSync("agent/approval-policy.mjs","utf8");
          for (const s of ["crypto.timingSafeEqual","/api/run","/api/approve","/api/stop","/api/pc/authorize","await safeUrl(u)","routeWebSocket","OLLAMA_URL","otp|captcha|verification","pending.resume"]) if (!a.includes(s)) throw new Error("missing safety/runtime feature: "+s);
          for (const s of ["dns.lookup","isPrivateAddress","::ffff","embedded usernames or passwords","Private or reserved IP","redactUrlForDisplay","safeWebSocketUrl"]) if (!sec.includes(s)) throw new Error("missing URL validation feature: "+s);
          for (const s of ["actionNeedsApproval","formAssociated","submitType","mode ==="]) if (!ap.includes(s)) throw new Error("missing approval policy: "+s);
          const build=fs.readFileSync("build.mjs","utf8");
          const csp=fs.readFileSync("vercel.json","utf8");
          if (!csp.includes("script-src 'self';") || csp.includes("script-src 'self' 'unsafe-inline'")) throw new Error("CSP must block inline JavaScript");
          for (const s of ["app.js","security.mjs","approval-policy.mjs"]) if (!build.includes(s)) throw new Error("setup bundle omits "+s);
          const installer=fs.readFileSync("agent/install.ps1","utf8");
          for (const s of ["$PSScriptRoot","Copy-Item","npm install","npx playwright install chromium","ollama pull qwen2.5:3b"]) if (!installer.includes(s)) throw new Error("missing installer step: "+s);
          console.log("Dashboard routes, agent safety controls and installer present");
          '
  windows-sanity:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check runtime and dashboard syntax on Windows
        run: npm run check --prefix agent; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node --check app.js; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; node --check agent-connection-policy.mjs
      - name: Install native-agent dependencies on Windows
        run: npm install --prefix agent
      - name: Install Chromium on Windows
        run: npx playwright install chromium
      - name: Exercise browser and safety smoke tests on Windows
        run: npm run test:smoke --prefix agent

